<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 356" width="1176" height="356" role="img" aria-labelledby="custom-exercise-title custom-exercise-desc">
<title id="custom-exercise-title">Custom exercise pipeline</title>
<desc id="custom-exercise-desc">A therapist uploads or records a demo, trims it, and the browser extracts pose keypoints; the exercise is saved as queued and an offline worker fits a template model, marking it ready or failed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c665d"/></marker><marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#335e49"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4f36"/></marker></defs>
<rect width="1176" height="356" fill="#f7f8f4"/>
<text x="24" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#213a31">Adding a therapist's own exercise</text>
<rect x="16" y="64" width="568" height="172" rx="8" fill="none" stroke="#8a9787" stroke-width="1" stroke-dasharray="2,4"/><text x="30" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="0.1em" fill="#5c665d">IN THE THERAPIST'S BROWSER</text><rect x="592" y="64" width="192" height="172" rx="8" fill="none" stroke="#8a9787" stroke-width="1" stroke-dasharray="2,4"/><text x="606" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="0.1em" fill="#5c665d">API</text><rect x="792" y="64" width="192" height="172" rx="8" fill="none" stroke="#8a9787" stroke-width="1" stroke-dasharray="2,4"/><text x="806" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="0.1em" fill="#5c665d">OFFLINE WORKER</text><path d="M200,148 L216,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M384,148 L400,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M568,148 L608,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M776,148 L808,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M976,136 L988,136 Q996,136 996,128 L996,116 Q996,108 1004,108 L1016,108" fill="none" stroke="#456838" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M976,160 L988,160 Q996,160 996,168 L996,188 Q996,196 1004,196 L1016,196" fill="none" stroke="#8f513a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="108" width="168" height="80" rx="6" fill="#f7f8f4"/><rect x="32" y="108" width="168" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="44" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">UPLOAD OR RECORD</text><text x="44" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Demo video</text><text x="44" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">the therapist</text><text x="44" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">doing the movement</text><rect x="216" y="108" width="168" height="80" rx="6" fill="#f7f8f4"/><rect x="216" y="108" width="168" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="228" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">TRIM</text><text x="228" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Keep 2+ reps</text><text x="228" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">up to 60 s,</text><text x="228" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">start and end at rest</text><rect x="400" y="108" width="168" height="80" rx="6" fill="#f7f8f4"/><rect x="400" y="108" width="168" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="412" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">MEDIAPIPE</text><text x="412" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Pose extraction</text><text x="412" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">keypoints per frame</text><text x="412" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">plus a preview fit</text><rect x="608" y="108" width="168" height="80" rx="6" fill="#f7f8f4"/><rect x="608" y="108" width="168" height="80" rx="6" fill="#f1efe5" stroke="#8a9787" stroke-width="1.25"/><text x="620" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">STATUS: QUEUED</text><text x="620" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Saved</text><text x="620" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">video to a private</text><text x="620" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">bucket</text><rect x="808" y="108" width="168" height="80" rx="6" fill="#f7f8f4"/><rect x="808" y="108" width="168" height="80" rx="6" fill="#f5e8df" stroke="#9a4f36" stroke-width="1.25"/><text x="820" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#9a4f36">TEMPLATE-1.1.0</text><text x="820" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Fit template</text><text x="820" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">claims the next</text><text x="820" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">queued exercise</text><rect x="1016" y="72" width="144" height="72" rx="6" fill="#f7f8f4"/><rect x="1016" y="72" width="144" height="72" rx="6" fill="#e5efd9" stroke="#456838" stroke-width="1.25"/><text x="1028" y="92" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#456838">READY</text><text x="1028" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Prescribable</text><text x="1028" y="130" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">like built-ins</text><rect x="1016" y="160" width="144" height="72" rx="6" fill="#f7f8f4"/><rect x="1016" y="160" width="144" height="72" rx="6" fill="#f5e4d8" stroke="#8f513a" stroke-width="1.25"/><text x="1028" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#8f513a">FAILED</text><text x="1028" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Reason shown</text><text x="1028" y="218" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">record again</text><text x="32" y="276" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#5c665d">The API never trains. Patient reps of a ready exercise are re-checked on the server with the fitted template.</text><line x1="24" y1="312" x2="1152" y2="312" stroke="#e1e6dc"/><rect x="24" y="324" width="16" height="12" rx="2" fill="#f5e8df" stroke="#9a4f36"/><text x="54" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">offline fit</text><line x1="156.4" y1="330" x2="178.4" y2="330" stroke="#5c665d" stroke-width="1.5"/><text x="186.4" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">pipeline step</text>
</svg>
