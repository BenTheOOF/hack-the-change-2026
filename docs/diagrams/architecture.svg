<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">PhysioTrace system architecture</title>
<desc id="architecture-desc">The browser extracts pose keypoints with MediaPipe, segments and classifies reps with rules, and routes them; the FastAPI service re-checks reps and stores care data in Supabase with row-level security; an offline worker fits custom exercise templates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c665d"/></marker><marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#335e49"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4f36"/></marker></defs>
<rect width="1000" height="680" fill="#f7f8f4"/>
<text x="24" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#213a31">How PhysioTrace fits together</text>
<rect x="24" y="64" width="616" height="236" rx="8" fill="none" stroke="#8a9787" stroke-width="1" stroke-dasharray="2,4"/><text x="38" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="0.1em" fill="#5c665d">BROWSER · NEXT.JS APP ON VERCEL</text><rect x="648" y="300" width="328" height="164" rx="8" fill="none" stroke="#8a9787" stroke-width="1" stroke-dasharray="2,4"/><text x="662" y="322" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="0.1em" fill="#5c665d">SUPABASE</text><path d="M168,148 L192,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M312,148 L336,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M456,148 L480,148" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M600,136 L700,136" fill="none" stroke="#335e49" stroke-width="1.5" marker-end="url(#arrow-link)"/><rect x="614.3" y="111" width="71.4" height="18" rx="2" fill="#f7f8f4"/><text x="650" y="123.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#335e49">KEYPOINTS</text><path d="M600,168 L700,168" fill="none" stroke="#335e49" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/><rect x="604.4" y="177" width="91.19999999999999" height="18" rx="2" fill="#f7f8f4"/><text x="650" y="189.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#335e49">CLIP·CONSENT</text><path d="M820,196 L820,356" fill="none" stroke="#335e49" stroke-width="1.5" marker-end="url(#arrow-link)"/><rect x="841" y="267" width="78" height="18" rx="2" fill="#f7f8f4"/><text x="880" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#335e49">USER TOKEN</text><path d="M144,332 L144,304" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="181.5" y="309" width="45" height="18" rx="2" fill="#f7f8f4"/><text x="204" y="321.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#5c665d">PAGES</text><path d="M264,400 L664,400" fill="none" stroke="#335e49" stroke-width="1.5" marker-end="url(#arrow-link)"/><rect x="411.8" y="375" width="104.39999999999999" height="18" rx="2" fill="#f7f8f4"/><text x="464" y="387.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#335e49">SIGN-IN·COOKIE</text><path d="M820,520 L820,444" fill="none" stroke="#5c665d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="834.4" y="473" width="91.19999999999999" height="18" rx="2" fill="#f7f8f4"/><text x="880" y="485.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#5c665d">CLAIM·FINISH</text><rect x="48" y="108" width="120" height="80" rx="6" fill="#f7f8f4"/><rect x="48" y="108" width="120" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="60" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">PRETRAINED</text><text x="60" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">MediaPipe</text><text x="60" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">pose keypoints</text><rect x="192" y="108" width="120" height="80" rx="6" fill="#f7f8f4"/><rect x="192" y="108" width="120" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="204" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">PER EXERCISE</text><text x="204" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">State machine</text><text x="204" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">splits reps by</text><text x="204" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">joint angles</text><rect x="336" y="108" width="120" height="80" rx="6" fill="#f7f8f4"/><rect x="336" y="108" width="120" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="348" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">RULES-1.2.0</text><text x="348" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Rule classifier</text><text x="348" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">shared interface</text><rect x="480" y="108" width="120" height="80" rx="6" fill="#f7f8f4"/><rect x="480" y="108" width="120" height="80" rx="6" fill="#f5e8df" stroke="#9a4f36" stroke-width="1.25"/><text x="492" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#9a4f36">THRESHOLD</text><text x="492" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Routing</text><text x="492" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">count, replay,</text><text x="492" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">or review</text><text x="48" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#5c665d">Video stays on the device (IndexedDB). Only keypoints leave by default.</text><text x="48" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#5c665d">Custom exercises use template-1.1.0 behind the same interface.</text><rect x="24" y="332" width="240" height="84" rx="6" fill="#f7f8f4"/><rect x="24" y="332" width="240" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="36" y="352" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">VERCEL</text><text x="36" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Next.js 16 server</text><text x="36" y="390" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">serves pages, refreshes</text><text x="36" y="405" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">the Supabase session</text><rect x="700" y="112" width="260" height="84" rx="6" fill="#f7f8f4"/><rect x="700" y="112" width="260" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="712" y="132" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">FLY</text><text x="712" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">FastAPI</text><text x="712" y="170" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">re-classifies each rep,</text><text x="712" y="185" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">therapist queue, reviews</text><rect x="664" y="356" width="96" height="88" rx="6" fill="#f7f8f4"/><rect x="664" y="356" width="96" height="88" rx="6" fill="#f1efe5" stroke="#8a9787" stroke-width="1.25"/><text x="676" y="376" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">AUTH</text><text x="676" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Auth</text><text x="676" y="414" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">email,</text><text x="676" y="429" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">Google</text><rect x="772" y="356" width="96" height="88" rx="6" fill="#f7f8f4"/><rect x="772" y="356" width="96" height="88" rx="6" fill="#f1efe5" stroke="#8a9787" stroke-width="1.25"/><text x="784" y="376" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">POSTGRES</text><text x="784" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Care data</text><text x="784" y="414" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">RLS on</text><text x="784" y="429" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">every table</text><rect x="880" y="356" width="84" height="88" rx="6" fill="#f7f8f4"/><rect x="880" y="356" width="84" height="88" rx="6" fill="#f1efe5" stroke="#8a9787" stroke-width="1.25"/><text x="892" y="376" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">STORAGE</text><text x="892" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Clips</text><text x="892" y="414" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">private</text><text x="892" y="429" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">buckets</text><rect x="700" y="520" width="260" height="84" rx="6" fill="#f7f8f4"/><rect x="700" y="520" width="260" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25" stroke-dasharray="5,4"/><text x="712" y="540" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">OFFLINE · ML/WORKER.PY</text><text x="712" y="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Template fitter</text><text x="712" y="578" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">fits therapist exercises,</text><text x="712" y="593" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">never in a request</text><line x1="24" y1="632" x2="976" y2="632" stroke="#e1e6dc"/><rect x="24" y="644" width="16" height="12" rx="2" fill="#f5e8df" stroke="#9a4f36"/><text x="54" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">routing decision</text><line x1="188.4" y1="650" x2="210.4" y2="650" stroke="#335e49" stroke-width="1.5"/><text x="218.4" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">HTTP / API call</text><line x1="346.4" y1="650" x2="368.4" y2="650" stroke="#5c665d" stroke-width="1.5" stroke-dasharray="5,4"/><text x="376.4" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">only with consent, or offline</text><line x1="594" y1="650" x2="616" y2="650" stroke="#5c665d" stroke-width="1.5"/><text x="624" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">in-browser step</text>
</svg>
