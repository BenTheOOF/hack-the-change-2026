<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="rep-routing-title rep-routing-desc">
<title id="rep-routing-title">How each rep is routed</title>
<desc id="rep-routing-desc">A classified rep is counted when correct, paused with a skeleton replay and cue when incorrect, and sent to the assigned therapist when uncertain; the therapist's label and feedback go to the patient's feed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c665d"/></marker><marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#335e49"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4f36"/></marker></defs>
<rect width="1000" height="600" fill="#f7f8f4"/>
<text x="24" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#213a31">What happens to each rep</text>
<path d="M172,248 L196,248" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M372,224 L384,224 Q392,224 392,216 L392,136 Q392,128 400,128 L476,128" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="324.9" y="167" width="58.199999999999996" height="18" rx="2" fill="#f7f8f4"/><text x="354" y="179.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#5c665d">CORRECT</text><path d="M372,248 L476,248" fill="none" stroke="#5c665d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="404.3" y="223" width="71.4" height="18" rx="2" fill="#f7f8f4"/><text x="440" y="235.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#5c665d">INCORRECT</text><path d="M372,272 L384,272 Q392,272 392,280 L392,376 Q392,384 400,384 L476,384" fill="none" stroke="#9a4f36" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="312.3" y="319" width="71.4" height="18" rx="2" fill="#f7f8f4"/><text x="348" y="331.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.06em" fill="#9a4f36">UNCERTAIN</text><path d="M704,384 L772,384" fill="none" stroke="#9a4f36" stroke-width="1.5" marker-end="url(#arrow-accent)"/><path d="M874,424 L874,456" fill="none" stroke="#9a4f36" stroke-width="1.5" marker-end="url(#arrow-accent)"/><path d="M704,248 L772,248" fill="none" stroke="#5c665d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="24" y="208" width="148" height="80" rx="6" fill="#f7f8f4"/><rect x="24" y="208" width="148" height="80" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="36" y="228" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">STATE MACHINE</text><text x="36" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">One rep</text><text x="36" y="266" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">keypoint frames</text><rect x="196" y="196" width="176" height="104" rx="6" fill="#f7f8f4"/><rect x="196" y="196" width="176" height="104" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="208" y="216" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">CLASSIFIER</text><text x="208" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Label + confidence</text><text x="208" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">uncertain if tracking</text><text x="208" y="269" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">is below the plan's</text><text x="208" y="284" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">threshold (0.8 default)</text><rect x="476" y="88" width="228" height="84" rx="6" fill="#f7f8f4"/><rect x="476" y="88" width="228" height="84" rx="6" fill="#e5efd9" stroke="#456838" stroke-width="1.25"/><text x="488" y="108" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#456838">COUNTED</text><text x="488" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Counts toward today</text><text x="488" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">logged with confidence</text><text x="488" y="161" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">and model version</text><rect x="476" y="208" width="228" height="84" rx="6" fill="#f7f8f4"/><rect x="476" y="208" width="228" height="84" rx="6" fill="#f5e4d8" stroke="#8f513a" stroke-width="1.25"/><text x="488" y="228" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#8f513a">NOT COUNTED</text><text x="488" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Pause and replay</text><text x="488" y="266" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">skeleton replay of the rep</text><text x="488" y="281" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">plus a corrective cue</text><rect x="772" y="208" width="204" height="84" rx="6" fill="#f7f8f4"/><rect x="772" y="208" width="204" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="784" y="228" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">NEXT REP</text><text x="784" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Patient tries again</text><text x="784" y="266" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">counting resumes on</text><text x="784" y="281" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">the next rep</text><rect x="476" y="344" width="228" height="84" rx="6" fill="#f7f8f4"/><rect x="476" y="344" width="228" height="84" rx="6" fill="#f5e8df" stroke="#9a4f36" stroke-width="1.25"/><text x="488" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#9a4f36">REVIEW QUEUE</text><text x="488" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Assigned therapist</text><text x="488" y="402" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">clip only with review</text><text x="488" y="417" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">consent, else pose replay</text><rect x="772" y="344" width="204" height="84" rx="6" fill="#f7f8f4"/><rect x="772" y="344" width="204" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="784" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">LABEL</text><text x="784" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Correct or incorrect</text><text x="784" y="402" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">plus error type and</text><text x="784" y="417" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">written feedback</text><rect x="772" y="456" width="204" height="84" rx="6" fill="#f7f8f4"/><rect x="772" y="456" width="204" height="84" rx="6" fill="#ffffff" stroke="#8a9787" stroke-width="1.25"/><text x="784" y="476" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10" letter-spacing="0.08em" fill="#5c665d">PATIENT FEED</text><text x="784" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#213a31">Feedback appears</text><text x="784" y="514" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">a correct label counts</text><text x="784" y="529" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#5c665d">on the rep's original day</text><line x1="24" y1="560" x2="976" y2="560" stroke="#e1e6dc"/><rect x="24" y="572" width="16" height="12" rx="2" fill="#f5e8df" stroke="#9a4f36"/><text x="54" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">therapist loop</text><line x1="175.60000000000002" y1="578" x2="197.60000000000002" y2="578" stroke="#5c665d" stroke-width="1.5"/><text x="205.60000000000002" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">routing step</text><line x1="314.40000000000003" y1="578" x2="336.40000000000003" y2="578" stroke="#5c665d" stroke-width="1.5" stroke-dasharray="5,4"/><text x="344.40000000000003" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5c665d">waits for the patient</text>
</svg>
