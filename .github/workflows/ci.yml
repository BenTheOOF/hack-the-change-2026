name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Copies the MediaPipe wasm and downloads the pose model into public/mediapipe.
      - run: npm run pose:setup
      - run: npm run typecheck
      - run: npm test
      # Builds without NEXT_PUBLIC_* values. Vercel supplies the real ones for deploys.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # uv installs the Python pinned in backend/.python-version. The ml group is not synced.
      - run: uv sync --locked
      - run: uv run pytest
