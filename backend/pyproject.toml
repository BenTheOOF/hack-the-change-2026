[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# fastapi: the framework. uvicorn: serves it. httpx: calls Supabase and the LLM.
# pydantic-settings: reads the root .env.
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = ["pytest"]
ml = [
    "numpy>=2.5.4",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
